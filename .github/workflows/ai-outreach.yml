name: Run AI Outreach

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Outreach
        run: python main.py --mode all --download --filter ai

      - name: Upload Excel
        uses: actions/upload-artifact@v4
        with:
          name: AI_Jobs_Courses
          path: AI_Jobs_Courses.xlsx

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: AI-PDFs
          path: downloads/
